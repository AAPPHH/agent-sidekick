
# KI:connect.nrw (university quota) through the OpenCode agent CLI.
# Key: `agent-sidekick setup --backend kiconnect` (keyring user `backend-kiconnect`). A
# KI:connect key is valid for one month and extended by every login to the web interface;
# after it expired, create a new one there ("Rotate") and store it with the same command.
[backends.kiconnect]
harness = "opencode"
provider = "openai-compatible"
base_url = "https://chat.kiconnect.nrw/api/v1"
models = ["openai-gpt-oss-120b", "qwen-qwen3-8-27b"]   # the first one is the default
description = "OpenCode agent via KI:connect.nrw (university quota). Free, draft quality; reads, edits and runs commands in cwd without asking. For small, well-specified changes with a test as the check, and drafts that you review. Models: openai-gpt-oss-120b (default, fast: seconds per small task; give it at least 5 turns), qwen-qwen3-8-27b (slow on KI:connect: about 5 minutes per task). Results can claim work that was not done: always check the diff."
cost = "free"
max_concurrent = 1
