name: Data validate

on:
  push:
    branches: [main]
    paths: ["data/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: data-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download the latest agent-sidekick release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'agent-sidekick-x86_64-unknown-linux-musl.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/agent-sidekick-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP/bin" agent-sidekick

      - name: Validate
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          "$RUNNER_TEMP/bin/agent-sidekick" data validate \
            --base "${{ github.event.before }}" \
            --head "${{ github.event.after }}" \
            --pusher "${{ github.actor }}" \
            --root "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/violations.txt"

      - name: Revert the pushed commits and open an issue
        if: steps.validate.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before="${{ github.event.before }}"
          after="${{ github.event.after }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            git revert --no-edit "$after"
          else
            git revert --no-edit "$before..$after"
          fi
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
          {
            echo "Push $after by ${{ github.actor }} violated the data rules and was reverted."
            echo
            cat "$RUNNER_TEMP/violations.txt"
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "data: push by ${{ github.actor }} reverted" --body-file "$RUNNER_TEMP/issue.md"
