name: Data aggregate

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      AGENT_SIDEKICK_VERSION: v0.6.0
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require that all data paths are validated
        id: gate
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/data-validated^{commit}" > /dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet data-validated HEAD -- data '.github/workflows/data-*.yml' .github/CODEOWNERS; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "tag=$(git rev-parse data-validated)" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the pinned agent-sidekick release and verify its checksum
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          archive=agent-sidekick-x86_64-unknown-linux-musl.tar.gz
          dl="$RUNNER_TEMP/dl"
          mkdir -p "$dl" "$RUNNER_TEMP/bin"
          gh release download "$AGENT_SIDEKICK_VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --pattern SHA256SUMS --dir "$dl"
          (cd "$dl" && grep "  $archive\$" SHA256SUMS | sha256sum -c -)
          tar -xzf "$dl/$archive" -C "$RUNNER_TEMP/bin" agent-sidekick

      - name: Aggregate, commit and advance data-validated
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bin/agent-sidekick" data aggregate --root "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aggregate/latest.parquet
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "data: aggregate"
          git push origin HEAD:main
          git tag -f data-validated HEAD
          git push --force-with-lease="refs/tags/data-validated:${{ steps.gate.outputs.tag }}" origin refs/tags/data-validated

      - name: Open an issue when aggregation failed
        if: failure()
        run: |
          gh issue create --title "data: aggregate failed" --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
