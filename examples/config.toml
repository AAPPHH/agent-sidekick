# agent-sidekick config.toml with four backends: claude, local and aider (the example in
# docs/REFERENCE.md) plus the optional kiconnect (section 4), which needs a stored key. The routing
# rules in examples/CLAUDE.md cover the same four backends. Section 5 shows a commented-out
# alternative for kiconnect with the OpenCode harness.
#
# Copy to the config directory:
#   Linux:   ~/.config/agent-sidekick/config.toml
#   Windows: %APPDATA%\agent-sidekick\config.toml
#   macOS:   ~/Library/Application Support/agent-sidekick/config.toml
#
# Without a [backends] section agent-sidekick behaves exactly like v0.1 (one implicit
# claude-oauth backend named "claude"). As soon as [backends] exists, only the backends
# listed here are available and exactly one of them must have `default = true`.
#
# The calling Claude session chooses a backend by reading `description` and `cost` from the
# sidekick_backends tool, so write descriptions for that reader: what the backend is good
# at, what it is bad at, and what it costs.
#
# One backend per provider, the model as a parameter: `models` lists the models a backend
# offers (an allowlist for the `model` parameter of sidekick_run; a model not listed is
# rejected before anything runs) and `model` is the default (without it: the first entry of
# `models`). The calling session picks the backend and one of its models.

max_concurrent = 2          # global limit over all backends; further runs are queued
default_max_turns = 30
default_timeout_s = 1800
# claude_path = "/abs/path/to/claude"   # used by claude-oauth and claude-endpoint backends
# pass_env = ["CLAUDE_CODE_MAX_OUTPUT_TOKENS"]   # inherited variables to keep for every backend
# default_model = "sonnet"  # only applies to the implicit backend (no [backends] section)

# 1) The second Claude account (subscription OAuth token).
#    Token: `agent-sidekick setup --no-wizard` (asks for every claude-oauth backend) or
#    `agent-sidekick setup --backend claude`. A claude-oauth backend named "claude" (or
#    "sidekick", its name before v0.6) uses the v0.1 secret (keyring user `oauth-token`,
#    file `token`), so an existing installation keeps its token.
[backends.claude]
type = "claude-oauth"
description = "Second Claude subscription account (Claude Code). Best quality for complex, multi-file changes and debugging; uses that account's quota."
default = true
cost = "quota"
max_concurrent = 1
# config_dir = "~/.claude-sidekick"   # default for a backend named "claude"
# model = "sonnet"                       # default model (--model)
# models = ["sonnet", "opus", "haiku"]   # optional allowlist; without it any model is accepted

# 2) Claude Code against a local model through Ollama's Anthropic-compatible API
#    (Ollama 0.14 or later; pull the model first: `ollama pull qwen3-coder`).
#    Key: `agent-sidekick setup --backend local` and enter any value such as `ollama`;
#    local servers ignore it. Keys shorter than 8 characters are not redacted from output.
#    LM Studio instead: base_url = "http://localhost:1234", auth = "bearer",
#    model = the model identifier shown in LM Studio, and optionally
#    env = { CLAUDE_CODE_ATTRIBUTION_HEADER = "0" } (LM Studio's recommendation for
#    prompt caching).
#    Ollama's cloud (https://ollama.com) needs auth = "bearer" and a real API key.
[backends.local]
type = "claude-endpoint"
description = "Claude Code driving a local qwen3-coder via Ollama. Free and private, but slower and weaker than Claude: good for boilerplate, tests, docs and mechanical refactors; not for subtle multi-file logic."
cost = "free"
base_url = "http://localhost:11434"
model = "qwen3-coder"
# auth = "x-api-key"        # default: ANTHROPIC_API_KEY (x-api-key header); "bearer": ANTHROPIC_AUTH_TOKEN
# api_key_env = "OLLAMA_API_KEY"   # read the key from this variable of the MCP server's environment instead;
#                                  # it is then removed from the environment of every other backend
#    base_url must not contain credentials (user:password@; config error), and its host must be
#    ASCII (xn-- form for internationalised names) with a valid port.
# config_dir = "~/.claude-sidekick-local"   # default ~/.claude-sidekick-<name>; must differ from every claude-oauth dir
# max_concurrent = 1        # a local GPU usually serves one request at a time well

# 3) Aider (https://aider.chat) with the same local model, as a command backend.
#    No shell is involved: every array element is one argument, and {prompt} is replaced by
#    the whole prompt as a single argument. Placeholders: {prompt}, {cwd}, {max_turns},
#    {model}; they are replaced only after command[0] (a placeholder in the program name is a
#    config error). Aider has no turn limit flag, so {max_turns} is not used here. This
#    backend has the model fixed in the command (no {model}), so it takes no `models` and
#    ignores a requested model; see 4) for a command backend with several models.
#    --message: process one message, then exit. --yes-always: answer every confirmation
#    with yes. --no-auto-commits: leave the changes uncommitted for review.
[backends.aider]
type = "command"
description = "Aider with local qwen3-coder (Ollama). Free; edits files in cwd directly without asking (no tool permissions, no shell commands), changes are left uncommitted. Good for small, well-specified edits to named files."
cost = "free"
command = ["aider", "--model", "ollama_chat/qwen3-coder", "--yes-always", "--no-auto-commits", "--no-check-update", "--message", "{prompt}"]
env = { OLLAMA_API_BASE = "http://127.0.0.1:11434" }
max_concurrent = 1
# prompt_via_stdin = true   # required if command[0] is a .cmd/.bat script (then omit {prompt})
# pass_env = ["ANTHROPIC_API_KEY"]   # a command backend may keep an inherited variable that is normally removed
# secret_env = "ANTHROPIC_API_KEY"   # or hand it a stored secret instead, see 4)

# 4) Optional: delete this section if you do not use it. It is not reachable (and runs on it
#    fail) until its key is stored.
#    Aider against a hosted OpenAI-compatible API that needs a key (here the KI:connect.nrw
#    gateway of German universities; any OpenAI-compatible endpoint works the same way).
#    secret_env names the variable that receives the backend's stored secret. Store it with
#    `agent-sidekick setup --backend kiconnect` (hidden prompt; OS keyring user
#    `cmd-kiconnect`, file fallback `cmd-kiconnect.key` in the config directory). It is never
#    written to config.toml, and it is redacted from logs and tool output (values shorter
#    than 8 characters are not redacted). The variable must not also be set in `env`; it
#    replaces an inherited value of the same name.
#    PYTHONUTF8=1 avoids encoding errors of aider on Windows.
#    One backend for the provider, offering two of its models: {model} in the command is
#    replaced by the requested model (or the default, the first entry of `models`). `models`
#    is required with {model} and is an allowlist, because the value lands in aider's
#    command line; names must not start with "-". Inner spaces are allowed, e.g.
#    "Mistral Small 3.2 24B Instruct 2506".
[backends.kiconnect]
type = "command"
description = "Aider via KI:connect.nrw (university quota). Free, medium quality; edits files in cwd directly without asking. For boilerplate, tests and small, well-specified changes. Models: openai-gpt-oss-120b (general, default), qwen-qwen3-8-27b (code)."
cost = "free"
command = ["aider", "--model", "openai/{model}", "--no-git", "--yes-always", "--no-show-model-warnings", "--no-check-update", "--no-pretty", "--no-stream", "--message", "{prompt}"]
models = ["openai-gpt-oss-120b", "qwen-qwen3-8-27b"]
# model = "qwen-qwen3-8-27b"   # another default than the first entry
env = { OPENAI_API_BASE = "https://chat.kiconnect.nrw/api/v1", PYTHONUTF8 = "1" }
secret_env = "OPENAI_API_KEY"
max_concurrent = 1

# 5) Optional, commented out: the same KI:connect.nrw models through the OpenCode agent CLI
#    (harness = "opencode", since 0.3.0) instead of Aider. OpenCode reads, edits and runs
#    commands like Claude Code does. Install it first (`agent-sidekick harness install opencode`
#    prints the official commands, e.g. `npm install -g opencode-ai`), then store the key with
#    `agent-sidekick setup --backend kiconnect-oc` (OS keyring user `backend-kiconnect-oc`, file
#    fallback `backend-kiconnect-oc.key`). The key is never written to a file: the generated
#    opencode.json references it as {env:AGENT_SIDEKICK_PROVIDER_KEY}.
#    Each opencode backend runs isolated in <config-dir>/opencode/<name>/ (own home, config,
#    sessions, caches); your own ~/.config/opencode and ~/.opencode are not used.
#    max_turns is only a soft limit for OpenCode; timeout_s is the hard one.
#    OpenCode still executes project plugins (.opencode/plugin/*.js|ts in cwd or above, up
#    to the repository root, or named under "plugin" in the project's opencode.json), and
#    they see the provider key; only run it in projects you trust (docs/REFERENCE.md, OpenCode backends).
#    Rename it to `kiconnect` if you do not keep section 4.
# [backends.kiconnect-oc]
# harness = "opencode"
# provider = "openai-compatible"           # or "ollama" (no key) or "openrouter" (no base_url)
# base_url = "https://chat.kiconnect.nrw/api/v1"
# models = ["openai-gpt-oss-120b", "qwen-qwen3-8-27b"]   # the first one is the default
# description = "OpenCode agent via KI:connect.nrw (university quota). Free, medium quality; reads, edits and runs commands in cwd without asking. For boilerplate, tests and small, well-specified changes. Models: openai-gpt-oss-120b (general, default), qwen-qwen3-8-27b (code)."
# cost = "free"
# max_concurrent = 1
# read_only = true                         # deny edit/bash/webfetch (review-only runs)
# request_timeout_s = 600                  # header timeout before OpenCode retries (default 300)
# context_tokens = 128000                  # context window; OpenCode compacts before it is full (default 128000)
# max_output_tokens = 8192                 # max_tokens per response (default 8192)
# harness_path = "C:/Users/<you>/AppData/Roaming/npm/node_modules/opencode-ai/bin/opencode.exe"
# api_key_env = "KICONNECT_API_KEY"        # read the key from the MCP server's environment instead

# 6) Optional, commented out: the OpenAI Codex CLI (harness = "codex", since 0.3.0) with your
#    ChatGPT plan. Install it first (`npm install -g @openai/codex`), then run
#    `agent-sidekick setup --backend codex`: it creates the backend's own CODEX_HOME
#    (<config-dir>/codex/codex/) with a generated config.toml and prints the `codex login`
#    command for exactly that directory; your own ~/.codex is not used. With
#    auth = "api-key" the same command stores an OpenAI API key instead (keyring user
#    `backend-codex`). The agent's shell commands never see the key. max_turns is ignored
#    (timeout_s is the limit), allowed_tools too (use read_only).
# [backends.codex]
# harness = "codex"
# auth = "chatgpt"                         # or "api-key"
# description = "OpenAI Codex agent (GPT models). Strong for code changes, debugging and reviews; edits files and runs commands in cwd inside Codex's sandbox."
# max_concurrent = 1                       # one ChatGPT login: avoid parallel token refreshes
# models = ["gpt-6.1-sol", "gpt-6-luna"]   # optional allowlist; without it Codex's default
# read_only = true                         # Codex's read-only sandbox (review-only runs)
# windows_sandbox = "mxc"                  # Windows: mxc (default), elevated, unelevated
# base_url = "https://gateway.example/v1"  # api-key only: a Responses-compatible provider
# api_key_env = "OPENAI_API_KEY_SIDEKICK"  # api-key only: key from the MCP server's environment
